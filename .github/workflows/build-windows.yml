name: Build Windows Installer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Pre-download OCR models (bundled for fully offline first run)
        run: python download_models.py

      - name: Pre-download object-detection model (for line/zone crossing alerts)
        run: python download_yolo_model.py

      - name: Build standalone executable (PyInstaller)
        run: pyinstaller --noconfirm --onefile --windowed --name LPR-Camera-System gui_app.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # --- مراحل آپلود آرْتیفکت‌ها ---
      - name: Upload standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: LPR-Camera-System-exe
          path: dist/LPR-Camera-System.exe

      - name: Upload OCR models
        uses: actions/upload-artifact@v4
        with:
          name: easyocr_models
          path: easyocr_models/

      - name: Upload object-detection model
        uses: actions/upload-artifact@v4
        with:
          name: yolo_model
          path: yolo_model/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LPR-Setup-installer
          path: Output/

      # --- مرحله دیباگ برای بررسی دقیق مسیر فایل‌ها قبل از ساخت ریلیز ---
      - name: Debug - List generated files
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Write-Host "--- Contents of dist folder ---"
          Get-ChildItem -Path dist -Recurse
          Write-Host "--- Contents of Output folder ---"
          Get-ChildItem -Path Output -Recurse

      # --- ساخت ریلیز ---
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/LPR-Camera-System.exe
            Output/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
